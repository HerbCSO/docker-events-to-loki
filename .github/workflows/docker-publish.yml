name: Build and push image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: docker-events-to-loki

jobs:
  # Runs for every push, PR and manual trigger: builds the image (without
  # pushing) to catch Dockerfile/build breakage. No secrets involved.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs only for pushes to main / v* tags and manual dispatch. Scoped to
  # the "dockerhub" environment, whose deployment branch policy restricts
  # it to main and v* tags, and which holds the Docker Hub credentials -
  # keeps the token out of reach of arbitrary branches/PRs.
  push:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs only after a successful publish from main. Computes the next
  # semver - patch by default, or minor/major if the triggering commit's
  # SUBJECT LINE contains "[minor]"/"[major]" - then:
  #   1. re-tags the image `push` just published (by its sha-<commit> tag)
  #      with the new X.Y.Z / X.Y Docker Hub tags, via `imagetools create`
  #      (no rebuild - it just points new tags at the existing manifest)
  #   2. pushes a matching vX.Y.Z git tag and creates a GitHub release
  #
  # Re-tagging directly like this (rather than pushing a vX.Y.Z tag and
  # relying on the `tags: v*` trigger above to build it) is deliberate:
  # a git push made with the default GITHUB_TOKEN does NOT trigger other
  # workflow runs (GitHub suppresses that to prevent infinite loops), so
  # a tag pushed from this job would otherwise just... sit there, with no
  # X.Y.Z image ever actually published. The `tags: v*` trigger above
  # still exists for someone manually pushing a version tag by hand.
  #
  # Deliberately checks only the subject line (%s), not the full message
  # body (%B): a commit whose body merely *mentions* "[major]" - e.g.
  # explaining this very convention - would otherwise trigger a bogus
  # bump. (This happened: the commit that introduced this job described
  # "[major]" in its body and bumped itself straight to v1.0.0.)
  version:
    needs: [build, push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: bump
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          latest="${latest:-v0.0.0}"
          latest="${latest#v}"
          IFS=. read -r major minor patch <<<"$latest"

          msg=$(git log -1 --pretty=%s)
          if grep -qiE '\[major\]' <<<"$msg"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qiE '\[minor\]' <<<"$msg"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          {
            echo "new_tag=v${major}.${minor}.${patch}"
            echo "semver=${major}.${minor}.${patch}"
            echo "semver_minor=${major}.${minor}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag published image with the new version
        run: |
          src="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.bump.outputs.semver }}" \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.bump.outputs.semver_minor }}" \
            "$src"
          docker buildx imagetools inspect "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.bump.outputs.semver }}"

      - name: Push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.bump.outputs.new_tag }}" -m "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.new_tag }}" \
            --title "${{ steps.bump.outputs.new_tag }}" \
            --generate-notes
